name: party_pin
description: App for Partypeople
publish_to: "none"
version: 4.3.0+13

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geocoding: ^3.0.0
  google_maps_flutter: ^2.7.0
  google_maps_flutter_android: any
  google_maps_flutter_platform_interface: any
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  http: ^1.2.2
  file_picker: ^8.0.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0
  app_links: ^6.0.0
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - lib/Pics/Logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/Pics/Logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "lib/Pics/Logo.png"
  remove_alpha_ios: true
