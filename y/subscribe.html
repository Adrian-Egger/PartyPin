<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PartyPin Premium – PayPal Abo</title>
  <meta name="robots" content="noindex,nofollow" />

  <style>
    :root{
      --bgTop:#0E0F12;
      --bgBottom:#141A22;
      --panel:#15171C;
      --border:#2A2F38;
      --text:#ffffff;
      --muted:#B6BDC8;
      --accent:#FF3B30;
      --secondary:#00C2A8;
      --ok:#00C2A8;
      --err:#FF6B6B;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,var(--bgTop),var(--bgBottom));
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .wrap{width:100%;max-width:520px;}
    .card{
      background:rgba(21,23,28,.92);
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
    }
    .headline{font-size:20px;font-weight:900}
    .sub{color:var(--muted);font-size:13px}
    .msg{
      margin-top:12px;
      font-size:13px;
      padding:10px;
      border-radius:12px;
      display:none;
    }
    .msg.ok{background:rgba(0,194,168,.15);color:#dffef7}
    .msg.err{background:rgba(255,107,107,.15);color:#ffe3e3}
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <div class="headline">PartyPin Premium</div>
    <p class="sub">Zahlung sicher über PayPal. Premium wird sofort aktiviert.</p>

    <div id="paypal-button-container"></div>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
  // ====== FIXE KONFIGURATION ======
  const PLAN_MONTHLY = "P-55588718AV729883XNE6MJ5Y";
  const PLAN_YEARLY  = "P-0WL99384633096336NE6WUSA";

  const ACTIVATE_URL =
    "https://us-central1-partypin-5dc3f.cloudfunctions.net/activatePayPalSubscription";

  // ====== URL PARAMS ======
  const params = new URLSearchParams(window.location.search);
  const username = (params.get("u") || "").trim();
  const plan = (params.get("plan") || "monthly").toLowerCase();
  const selectedPlanId = plan === "yearly" ? PLAN_YEARLY : PLAN_MONTHLY;

  const msg = document.getElementById("msg");

  function showMsg(text, type){
    msg.style.display = "block";
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  if(!username){
    showMsg("Kein Username übergeben.", "err");
  }
</script>

<!-- 🔴 HIER MUSST DU DEINE **LIVE** CLIENT ID EINSETZEN -->
<script
  src="https://www.paypal.com/sdk/js
  ?client-id=Ab9P_0GJy0ZeHXkOLDfcbFmpCF_XYXIdSdSSjhF5yYVmflssYX7w90SGZmZv4ZFalIalWa4W1GScG1jQ
  &vault=true
  &intent=subscription">
</script>

<script>
  if(username){
    paypal.Buttons({
      createSubscription:(data, actions)=>{
        return actions.subscription.create({
          plan_id: selectedPlanId
        });
      },

      onApprove: async (data)=>{
        showMsg("Premium wird aktiviert …", "");

        try{
          const res = await fetch(ACTIVATE_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
              subscriptionId: data.subscriptionID,
              planId: selectedPlanId,
              username: username
            })
          });

          const json = await res.json();

          if(res.ok && json.status === "ok"){
            showMsg("Premium erfolgreich aktiviert. Du kannst dieses Fenster schließen.", "ok");
          } else {
            showMsg("Aktivierung fehlgeschlagen.", "err");
          }
        }catch(e){
          showMsg("Netzwerkfehler.", "err");
        }
      },

      onError: ()=>{
        showMsg("PayPal Fehler.", "err");
      }
    }).render("#paypal-button-container");
  }
</script>

</body>
</html>
